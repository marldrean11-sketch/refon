upstream refon_backend {
    server backend:4000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Listing photos are up to 8 MB each and up to 6 per request, so the proxy limit has
    # to sit above the API's own 50 MB total body ceiling.
    client_max_body_size 50m;

    # Uploads and API responses should not be buffered to disk twice.
    proxy_request_buffering off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The API already sets its own security headers via helmet; these cover the
    # statically served app.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Vite emits content-hashed filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Photos are immutable in practice: the filename contains a timestamp and a UUID.
    location /uploads/ {
        proxy_pass http://refon_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location /api/ {
        proxy_pass http://refon_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API sets trust proxy in production and keys its rate limiters on this.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Password change and photo upload can take a while on a slow link.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Client-side routing: unknown paths are React routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The entry HTML must never be cached, or a deploy leaves stale asset references.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }
}