<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0B0D" />
    <title>ReFon is offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0b0d; color: #f2f4f0; font-family: system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
      img { width: 72px; height: 72px; }
      h1 { margin: 20px 0 8px; font-size: 28px; }
      p { margin: 0 auto; max-width: 320px; color: #b9bec4; line-height: 1.5; }
      button { margin-top: 24px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: #c6ff3d; color: #0a0b0d; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="ReFon" />
      <h1>Offline ka muna.</h1>
      <p>ReFon needs a connection for live prices and stock. Check your Wi-Fi or data, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
