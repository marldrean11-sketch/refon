<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">ReFon demo listing angle photo</title>
  <desc id="desc">A dark phone shown at an angle on a studio surface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset=".55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <ellipse cx="610" cy="720" rx="300" ry="70" fill="#0f766e" opacity=".22" filter="url(#shadow)"/>
  <g transform="rotate(-13 600 450)">
    <rect x="410" y="100" width="380" height="700" rx="58" fill="#020617" opacity=".9"/>
    <rect x="430" y="120" width="340" height="660" rx="44" fill="url(#body)"/>
    <rect x="470" y="160" width="260" height="470" rx="24" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
    <circle cx="600" cy="270" r="64" fill="#0f172a" stroke="#94a3b8" stroke-width="5"/>
    <circle cx="600" cy="270" r="28" fill="#334155"/>
    <rect x="520" y="690" width="160" height="14" rx="7" fill="#64748b"/>
  </g>
  <text x="600" y="842" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#115e59">REFON DEMO · ANGLE PHOTO</text>
</svg>
