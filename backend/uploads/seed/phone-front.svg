<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">ReFon demo listing front photo</title>
  <desc id="desc">A front-facing blue phone photographed against a soft studio background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#172554" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="190" cy="160" r="180" fill="#fff" opacity=".28"/>
  <circle cx="1040" cy="760" r="240" fill="#1d4ed8" opacity=".16"/>
  <rect x="390" y="110" width="420" height="680" rx="62" fill="#0f172a" filter="url(#shadow)"/>
  <rect x="408" y="128" width="384" height="644" rx="49" fill="url(#phone)"/>
  <rect x="532" y="146" width="136" height="24" rx="12" fill="#0f172a" opacity=".8"/>
  <circle cx="600" cy="450" r="118" fill="#0b1220" opacity=".46"/>
  <circle cx="600" cy="450" r="82" fill="#172554" stroke="#93c5fd" stroke-width="5" opacity=".9"/>
  <circle cx="600" cy="450" r="42" fill="#60a5fa" opacity=".5"/>
  <text x="600" y="842" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">REFON DEMO · FRONT PHOTO</text>
</svg>
