<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">ReFon demo listing detail photo</title>
  <desc id="desc">A close-up condition photo showing a phone edge and camera detail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset=".45" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#7c2d12" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g transform="rotate(8 600 450)" filter="url(#shadow)">
    <rect x="270" y="170" width="660" height="470" rx="72" fill="#1e293b"/>
    <rect x="300" y="200" width="600" height="410" rx="54" fill="#334155"/>
    <rect x="350" y="250" width="230" height="230" rx="42" fill="#0f172a" stroke="#94a3b8" stroke-width="8"/>
    <circle cx="430" cy="330" r="58" fill="#1e293b" stroke="#64748b" stroke-width="8"/>
    <circle cx="505" cy="405" r="42" fill="#1e293b" stroke="#64748b" stroke-width="7"/>
    <rect x="650" y="250" width="180" height="360" rx="32" fill="url(#metal)"/>
    <path d="M700 330l80 90M690 380l120 80" stroke="#f8fafc" stroke-width="9" stroke-linecap="round" opacity=".65"/>
  </g>
  <text x="600" y="790" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#9a3412">REFON DEMO · CONDITION DETAIL</text>
</svg>
