# Render Blueprint for a hosted ReFon demo: one Docker web service (the API also
# serves the website, see the root Dockerfile) plus one PostgreSQL database.
#
# In Render: New > Blueprint > pick this repository. Render asks for every value
# marked `sync: false` before the first deploy. Full steps: README, "Option C".
services:
  - type: web
    name: refon
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: refon-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Your public address, e.g. https://refon.onrender.com (no trailing slash).
      - key: APP_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      # The API will not start in production without an SMTP relay or BREVO_API_KEY.
      # Render's free tier blocks outbound SMTP ports, so use BREVO_API_KEY there
      # (it takes precedence over SMTP when both are set).
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # The free tier's disk is wiped on every deploy, so uploaded photos go to
      # an S3-compatible bucket (the hosted demo uses Supabase Storage). Seeded
      # demo images still ship inside the image and are served from disk.
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      # Supabase: https://<project>.storage.supabase.co/storage/v1/s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Supabase and MinIO need path-style addressing.
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      # Vercel forwards /api to this service (see vercel.json), so there are two
      # proxies in front of the API: Vercel, then Render. Use "1" if visitors
      # open the Render address directly instead.
      - key: TRUST_PROXY
        value: "2"

databases:
  - name: refon-db
    plan: free
    databaseName: refon
    user: refon
