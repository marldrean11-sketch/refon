# Render Blueprint for a hosted ReFon demo: one Docker web service (the API also
# serves the website, see the root Dockerfile) plus one PostgreSQL database.
#
# In Render: New > Blueprint > pick this repository. Render asks for every value
# marked `sync: false` before the first deploy. Full steps: README, "Option C".
services:
  - type: web
    name: refon
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: refon-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Your public address, e.g. https://refon.onrender.com (no trailing slash).
      - key: APP_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      # The API will not start in production without an SMTP relay.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # The free tier's disk is wiped on every deploy: seeded images live in the
      # image itself, but uploaded photos need STORAGE_DRIVER=s3 to survive.
      - key: STORAGE_DRIVER
        value: local
      # Vercel forwards /api to this service (see vercel.json), so there are two
      # proxies in front of the API: Vercel, then Render. Use "1" if visitors
      # open the Render address directly instead.
      - key: TRUST_PROXY
        value: "2"

databases:
  - name: refon-db
    plan: free
    databaseName: refon
    user: refon
