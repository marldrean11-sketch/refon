services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: refon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: refon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U refon -d refon']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Deliberately not published to the host: the database is only reachable from the
    # compose network. This keeps your local PostgreSQL on 5432 completely untouched.

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://refon:${POSTGRES_PASSWORD}@db:5432/refon?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      APP_URL: ${APP_URL:?APP_URL must be set in .env}
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL must be set in .env}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM must be set in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PREFIX: ${S3_PREFIX:-uploads/}
    volumes:
      # Required by STORAGE_DRIVER=local, otherwise photos vanish on every rebuild.
      - uploads:/app/backend/uploads
      # Keeps the no-relay mail outbox off the container filesystem.
      - mailoutbox:/app/backend/tmp
    expose:
      - '4000'

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  pgdata:
  uploads:
  mailoutbox: